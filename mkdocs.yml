site_name: Travel App Docs
site_author: Devcity
site_description: Local experiences along your road
copyright: '&copy; 2026 <a href="https://devcity.us">Devcity</a> · Contact: Yashen Fernando, Head of Engineering · <a href="mailto:yashen@devcity.us">yashen@devcity.us</a>'

docs_dir: docs

nav:
  - Home: index.md
  - Product: 01-product.md
  - User flows: 02-user-flows.md
  - Features: 03-features.md
  - Business model: 04-business-model.md
  - Market: 05-market.md
  - Technology: 06-technology.md
  - Roadmap: 07-roadmap.md
  - Funding: 08-funding.md

theme:
  name: material
  logo: assets/devcity-logo.png
  favicon: assets/devcity-logo.png
  font:
    text: DM Sans
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link

extra:
  generator: false
  social:
    - icon: material/web
      link: https://devcity.us
      name: devcity.us
    - icon: material/email
      link: mailto:yashen@devcity.us
      name: yashen@devcity.us

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
